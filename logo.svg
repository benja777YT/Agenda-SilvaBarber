<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ececf0"/>
    </linearGradient>
    <pattern id="stripes" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="72" height="72" fill="#ffffff"/>
      <rect width="24" height="72" fill="#9b1c2e"/>
      <rect x="36" width="12" height="72" fill="#c9c9cf"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".18"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3e"/><stop offset=".4" stop-color="#6a6a70"/><stop offset="1" stop-color="#1f1f22"/>
    </linearGradient>
    <clipPath id="tube"><rect x="196" y="132" width="120" height="248" rx="60"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1.3) translate(-256 -250)">
  <ellipse cx="256" cy="436" rx="96" ry="12" fill="#000" opacity=".08"/>
  <g clip-path="url(#tube)">
    <rect x="196" y="132" width="120" height="248" fill="url(#stripes)"/>
    <rect x="196" y="132" width="120" height="248" fill="url(#glass)"/>
  </g>
  <rect x="196" y="132" width="120" height="248" rx="60" fill="none" stroke="#000" stroke-opacity=".08" stroke-width="2"/>
  <rect x="180" y="100" width="152" height="40" rx="14" fill="url(#cap)"/>
  <circle cx="256" cy="86" r="20" fill="url(#cap)"/>
  <rect x="180" y="372" width="152" height="40" rx="14" fill="url(#cap)"/>
  </g>
</svg>
