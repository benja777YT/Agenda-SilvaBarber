<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>SilvaBarber</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SilvaBarber">
<meta name="theme-color" content="#f5f5f7" id="themeMeta">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{--bg:#f5f5f7;--card:#fff;--soft:#ececf0;--line:#e3e3e8;--txt:#1d1d1f;--mut:#8a8a90;
        --red:#9b1c2e;--red2:#6e1220;--bar:#9b1c2e;--sh:0 1px 3px #0000000a;color-scheme:light}
  [data-theme=dark]{--bg:#000;--card:#1c1c1e;--soft:#2c2c2e;--line:#38383a;--txt:#f2f2f7;--mut:#8e8e93;
        --red:#e0566a;--red2:#9b1c2e;--bar:#e0566a;--sh:none;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px -apple-system,system-ui,sans-serif;letter-spacing:-.01em;
       padding:env(safe-area-inset-top) 18px calc(180px + env(safe-area-inset-bottom));transition:background .2s}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 4px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:44px;height:44px;border-radius:12px;box-shadow:0 2px 8px #0000001a;flex:none}
  h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.03em}h1 span{color:var(--red)}
  .sub{color:var(--mut);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .avatar{flex:none;width:44px;height:44px;border-radius:22px;border:2px solid var(--card);padding:0;background:var(--red) center/cover;color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 8px #0002}
  .pole{height:4px;border-radius:2px;margin:12px 0 16px;
        background:repeating-linear-gradient(135deg,var(--red) 0 10px,var(--card) 10px 20px,#c9c9cf 20px 30px,var(--card) 30px 40px)}
  h3{font-size:22px;margin:4px 0 12px;font-weight:700}
  .view{display:none}.view.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  button{cursor:pointer;font-family:inherit}button:active{opacity:.7}
  body.lock{overflow:hidden}
  .seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:9px;font-size:14px;font-weight:500;transition:.2s}
  .seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 4px #0001}
  [data-theme=dark] .seg button.on{background:#48484a}
  .stats{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:10px}
  .card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}
  .stat small,.card small{color:var(--mut);font-size:12px;font-weight:500}.stat b{display:block;font-size:26px;margin-top:4px;letter-spacing:-.02em}
  .hero{background:linear-gradient(140deg,var(--red),var(--red2))!important;color:#fff;box-shadow:0 8px 20px #9b1c2e33}
  .hero small{color:#ffffffc0!important}
  .caja{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .caja div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
  .caja small{display:block;color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .caja b{font-size:15px}
  .banner{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:12px;box-shadow:var(--sh);border-left:4px solid var(--red);font-size:14px}
  .banner b{color:var(--red)}
  .day{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
  .day span:first-child::before{content:'';display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--red);margin-right:7px;vertical-align:middle}
  .item{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--sh);transition:transform .1s}
  .item:active{transform:scale(.98)}
  .item .n{font-weight:600}.item .s{color:var(--mut);font-size:13px;margin-top:3px}
  .item .p{color:var(--red);font-weight:700;white-space:nowrap}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--mut);margin-left:6px;vertical-align:1px}
  .tag.r{background:var(--red);color:#fff}
  .since{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}.since.r{color:var(--red);font-weight:600}
  .empty{color:var(--mut);text-align:center;margin-top:50px;line-height:1.5}
  .search{margin-bottom:6px}
  /* gráfico */
  .chart{margin:10px 0 4px}
  .chart svg{display:block;width:100%;overflow:visible}
  .tip{font-size:13px;color:var(--mut);min-height:20px}.tip b{color:var(--txt)}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
  .row3 div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
  .row3 b{display:block;font-size:17px;margin-top:2px}
  .cj{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .cj:first-of-type{border-top:0}.cj span{color:var(--mut)}
  /* nav */
  nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;border-radius:999px;z-index:5;
      background:var(--card);background:color-mix(in srgb,var(--card) 72%,transparent);
      -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
      border:1px solid color-mix(in srgb,var(--txt) 9%,transparent);box-shadow:0 10px 30px #0000001f,0 2px 6px #00000014}
  /* desvanecido inferior: el contenido se difumina antes de llegar a la barra */
  .fade{position:fixed;left:0;right:0;bottom:0;height:calc(170px + env(safe-area-inset-bottom));z-index:4;pointer-events:none;
        background:linear-gradient(to top,var(--bg) calc(88px + env(safe-area-inset-bottom)),
          color-mix(in srgb,var(--bg) 85%,transparent) calc(110px + env(safe-area-inset-bottom)),
          color-mix(in srgb,var(--bg) 45%,transparent) calc(140px + env(safe-area-inset-bottom)),transparent)}
  .fade-top{position:fixed;left:0;right:0;top:0;height:calc(28px + env(safe-area-inset-top));z-index:4;pointer-events:none;
        background:linear-gradient(to bottom,var(--bg) env(safe-area-inset-top),transparent)}
  nav button{flex:1;border:0;background:none;color:var(--txt);opacity:.75;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border-radius:999px;transition:background .25s,color .25s,opacity .25s}
  nav button:active{opacity:.5}
  nav button.on{opacity:1;color:var(--red);font-weight:600;background:color-mix(in srgb,var(--txt) 8%,transparent)}
  nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;z-index:6;
       border:0;background:var(--red);color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 22px #9b1c2e55}
  /* hojas */
  .sheet{position:fixed;inset:0;background:#0005;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;z-index:10}
  .sheet.open{display:flex}
  .sheet.open .panel{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  .panel{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .panel::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .panel h2{margin:0 0 10px;font-size:20px;font-weight:700}
  label{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
  input,select,textarea{width:100%;background:var(--bg);color:var(--txt);border:1px solid transparent;border-radius:12px;padding:12px;font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none;min-height:46px}
  .panel input,.panel select,.panel textarea{background:var(--soft)}
  .search input{background:var(--card);box-shadow:var(--sh)}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--red)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .chips button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:20px;padding:7px 13px;font-size:14px;transition:.15s}
  .chips button.on{background:var(--red);border-color:var(--red);color:#fff}
  .chips button i{font-style:normal;opacity:.6;font-size:12px}
  .btns{display:flex;gap:10px;margin-top:20px}
  .btns button,.wide{flex:1;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:600}
  .save{background:var(--red);color:#fff}.cancel{background:var(--soft);color:var(--txt)}
  .wide{width:100%;margin-top:12px}
  .del{background:none;color:var(--red);border:0;width:100%;margin-top:8px;padding:10px;font-size:15px}
  .pfoto{width:96px;height:96px;border-radius:48px;margin:6px auto 4px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;background:var(--red) center/cover;border:3px solid var(--card);box-shadow:0 4px 14px #0002}
  .link{display:block;margin:6px auto 0;background:none;border:0;color:var(--red);font-size:15px;font-weight:600}
  hr{border:0;border-top:1px solid var(--line);margin:22px 0 4px}
  .srv{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin-bottom:8px}
  .srv button{border:0;background:none;color:var(--mut);font-size:22px}
  .hist{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
  .hist span{color:var(--mut)}
  .ver{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  .nota{font-size:12px;color:var(--mut);margin-top:3px;font-style:italic}
</style>
</head>
<body>
<header>
  <div class="brand"><div style="min-width:0"><h1>Silva<span>Barber</span></h1><div class="sub" id="fecha"></div></div></div>
  <button class="avatar" id="avBtn" onclick="openPerfil()" aria-label="Perfil"></button>
</header>
<div class="pole"></div>

<!-- INICIO -->
<section class="view on" id="v-inicio">
  <div class="seg" id="segInicio"><button data-r="hoy" class="on">Hoy</button><button data-r="semana">Esta semana</button></div>
  <div id="bannerCitas"></div>
  <div class="stats">
    <div class="card stat"><small>Cortes</small><b id="cnt">0</b></div>
    <div class="card stat hero"><small>Ganado</small><b id="tot">$0</b></div>
  </div>
  <div class="caja" id="caja"></div>
  <div id="list"></div>
</section>

<!-- AGENDA -->
<section class="view" id="v-agenda">
  <h3>Citas agendadas</h3>
  <div id="agendaList"></div>
</section>

<!-- CLIENTES -->
<section class="view" id="v-clientes">
  <h3>Clientes</h3>
  <div class="search"><input id="buscar" placeholder="Buscar cliente" autocomplete="off"></div>
  <div id="cliList"></div>
</section>

<!-- RESUMEN -->
<section class="view" id="v-resumen">
  <h3>Resumen</h3>
  <div class="seg" id="segRes"><button data-d="7" class="on">Semana</button><button data-d="15">Quincena</button><button data-d="30">Mes</button></div>
  <div class="card hero"><small id="resLbl">Ganado</small><b style="display:block;font-size:34px;margin-top:4px;letter-spacing:-.02em" id="resTot">$0</b></div>
  <div class="row3">
    <div><small style="color:var(--mut);font-size:12px">Cortes</small><b id="resCnt">0</b></div>
    <div><small style="color:var(--mut);font-size:12px">Por corte</small><b id="resProm">$0</b></div>
    <div><small style="color:var(--mut);font-size:12px">Días trabajados</small><b id="resDias">0</b></div>
  </div>
  <div class="card">
    <small>Ganado por día</small>
    <div class="tip" id="tip"></div>
    <div class="chart" id="chart"></div>
  </div>
  <div class="card" style="margin-top:10px">
    <small>Caja del período</small>
    <div id="resCaja" style="margin-top:4px"></div>
  </div>
</section>

<button class="fab" id="fab" aria-label="Agregar" onclick="openForm(null, vista==='agenda'?'cita':'corte')">+</button>

<div class="fade-top"></div>
<div class="fade"></div>
<nav id="nav">
  <button data-v="inicio" class="on"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1 20 20M8.1 15.9 20 4"/></svg>Cortes</button>
  <button data-v="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
  <button data-v="clientes"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>Clientes</button>
  <button data-v="resumen"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>Resumen</button>
</nav>

<!-- Formulario corte / cita -->
<div class="sheet" id="formSheet" onclick="if(event.target===this)closeSheet('formSheet')">
  <div class="panel">
    <h2 id="fTitle">Nuevo corte</h2>
    <div class="seg" id="fTipo" style="margin-bottom:4px"><button data-t="corte" class="on">Corte hecho</button><button data-t="cita">Cita futura</button></div>
    <label>Cliente</label>
    <input id="fCli" placeholder="Nombre" autocomplete="off" list="clientesDL">
    <datalist id="clientesDL"></datalist>
    <label>Servicio</label>
    <input id="fSer" placeholder="Ej: Degradado + Barba">
    <div class="chips" id="serChips"></div>
    <div class="row">
      <div><label id="lPre">Precio</label><input id="fPre" type="number" inputmode="numeric" placeholder="10000"></div>
      <div id="wPag"><label>Pago</label><select id="fPag"><option>Efectivo</option><option>Transferencia</option><option>Débito</option></select></div>
    </div>
    <div class="row">
      <div><label>Fecha</label><input id="fFec" type="date"></div>
      <div><label>Hora</label><select id="fHor"></select></div>
    </div>
    <label>Nota</label>
    <textarea id="fNot" rows="2" placeholder="Opcional"></textarea>
    <button class="wide cancel" id="fHecho" onclick="marcarHecho()" style="color:var(--red)">✓ Marcar como hecho</button>
    <div class="btns"><button class="cancel" onclick="closeSheet('formSheet')">Cancelar</button><button class="save" onclick="save()">Guardar</button></div>
    <button class="del" id="fDel" onclick="del()">Eliminar</button>
  </div>
</div>

<!-- Ficha cliente -->
<div class="sheet" id="cliSheet" onclick="if(event.target===this)closeSheet('cliSheet')">
  <div class="panel" id="cliPanel"></div>
</div>

<!-- Perfil y ajustes -->
<div class="sheet" id="perfilSheet" onclick="if(event.target===this)closeSheet('perfilSheet')">
  <div class="panel">
    <h2>Perfil</h2>
    <div class="pfoto" id="pFoto"></div>
    <button class="link" onclick="$('fotoIn').click()">Cambiar foto</button>
    <input type="file" id="fotoIn" accept="image/*" style="display:none" onchange="cargarFoto(this.files[0])">
    <label>Tu nombre</label>
    <input id="pNom" placeholder="Ej: Benjamín" autocomplete="off">
    <label>Apariencia</label>
    <div class="seg" id="segTema"><button data-m="auto">Automático</button><button data-m="light">Día</button><button data-m="dark">Noche</button></div>
    <label>Servicios y precios</label>
    <div id="srvList"></div>
    <button class="link" onclick="addSrv()" style="margin:0">+ Agregar servicio</button>
    <div class="btns"><button class="save" onclick="guardarPerfil()">Guardar</button></div>
    <hr>
    <label>Respaldo</label>
    <p style="color:var(--mut);font-size:14px;margin:0">Tus datos viven solo en este iPhone. Exporta un respaldo de vez en cuando (se guarda en Archivos).<br><b id="ultResp" style="color:var(--txt)"></b></p>
    <div class="btns"><button class="cancel" onclick="exportar()">Exportar</button><button class="cancel" onclick="$('imp').click()">Importar</button></div>
    <div class="ver">SilvaBarber v1.0</div>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importar(this.files[0])">
  </div>
</div>

<script>
// ---------- datos ----------
const KEY='silvabarber_cortes', PKEY='silvabarber_perfil', SKEY='silvabarber_servicios';
const DEF_SRV=[['Degradado',10000],['Corte clásico',10000],['Barba',5000],['Cejas',0],['Diseño',0]];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let cortes=load(KEY,[]), perfil=load(PKEY,{}), servicios=load(SKEY,DEF_SRV);
const guardar=()=>localStorage.setItem(KEY,JSON.stringify(cortes));
let vista='inicio', rangoInicio='hoy', diasRes=7, editId=null, tipo='corte', fotoTmp=null, srvTmp=[];

// ---------- utilidades ----------
const $=id=>document.getElementById(id);
const clp=n=>'$'+Math.round(n||0).toLocaleString('es-CL');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=f=>new Date(f+'T12:00');
const hoy=()=>ymd(new Date());
const addD=(f,n)=>{const d=parse(f);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fLarga=f=>parse(f).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'short'});
const fCorta=f=>parse(f).toLocaleDateString('es-CL',{day:'numeric',month:'short'});
const hechos=()=>cortes.filter(c=>!c.cita);
const citas=()=>cortes.filter(c=>c.cita);
const suma=a=>a.reduce((s,c)=>s+(+c.precio||0),0);
const PAGOS=['Efectivo','Transferencia','Débito'];
function porPago(arr){const r={};PAGOS.forEach(p=>r[p]=0);arr.forEach(c=>r[c.pago]=(r[c.pago]||0)+(+c.precio||0));return r}
function grupoDias(arr,asc){
  const g={};arr.forEach(c=>(g[c.fecha]??=[]).push(c));
  return Object.entries(g).sort((a,b)=>asc?a[0].localeCompare(b[0]):b[0].localeCompare(a[0]))
    .map(([f,l])=>[f,l.sort((x,y)=>asc?(x.hora||'').localeCompare(y.hora||''):(y.hora||'').localeCompare(x.hora||''))]);
}
function haceTxt(d){
  if(d<=0)return'Vino hoy';if(d===1)return'No viene desde ayer';
  if(d<14)return`No viene hace ${d} días`;if(d<60)return`No viene hace ${Math.floor(d/7)} semanas`;
  return`No viene hace ${Math.floor(d/30)} meses`;
}

// ---------- tema ----------
const mq=matchMedia('(prefers-color-scheme: dark)');
function aplicarTema(m=perfil.tema||'auto'){
  const dark=m==='dark'||(m==='auto'&&mq.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  $('themeMeta').content=dark?'#000000':'#f5f5f7';
  if(vista==='resumen')renderResumen();
}
mq.addEventListener?.('change',()=>aplicarTema());

// ---------- navegación ----------
function irA(v){
  vista=v;document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('fab').style.display=(v==='inicio'||v==='agenda')?'block':'none';
  render();scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>irA(b.dataset.v));
function segmento(id,fn){document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{
  document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b)})}
segmento('segInicio',b=>{rangoInicio=b.dataset.r;renderInicio()});
segmento('segRes',b=>{diasRes=+b.dataset.d;renderResumen()});

// clicks en listas (delegados)
document.addEventListener('click',e=>{
  const it=e.target.closest('.item');if(!it)return;
  if(it.dataset.id)openForm(it.dataset.id);else if(it.dataset.cli!==undefined)openCliente(it.dataset.cli);
});

// ---------- render ----------
function render(){
  ({inicio:renderInicio,agenda:renderAgenda,clientes:renderClientes,resumen:renderResumen})[vista]();
  const vistos={};cortes.forEach(c=>{const n=(c.cliente||'').trim();if(n)vistos[n.toLowerCase()]=n});
  $('clientesDL').innerHTML=Object.values(vistos).map(n=>`<option value="${esc(n)}">`).join('');
}
const itemHTML=(c,extra='')=>`<div class="item" data-id="${esc(c.id)}">
  <div style="min-width:0"><div class="n">${esc(c.cliente||'Cliente')}${extra}</div><div class="s">${[c.hora,c.servicio,c.cita?'':c.pago].filter(Boolean).map(esc).join(' · ')}</div>${c.nota?`<div class="nota">${esc(c.nota)}</div>`:''}</div>
  <div class="p">${c.precio?clp(c.precio):''}</div></div>`;

function renderInicio(){
  const h=hoy(), lunes=addD(h,-((parse(h).getDay()+6)%7)), dom=addD(lunes,6);
  const vis=hechos().filter(c=>rangoInicio==='hoy'?c.fecha===h:c.fecha>=lunes&&c.fecha<=dom);
  $('cnt').textContent=vis.length;$('tot').textContent=clp(suma(vis));
  const pp=porPago(vis);
  $('caja').innerHTML=`<div><small>Efectivo</small><b>${clp(pp.Efectivo)}</b></div><div><small>Transfer.</small><b>${clp(pp.Transferencia)}</b></div><div><small>Débito</small><b>${clp(pp['Débito'])}</b></div>`;
  const ch=citas().filter(c=>c.fecha===h).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  $('bannerCitas').innerHTML=ch.length?`<div class="banner" onclick="irA('agenda')">📅<div>Hoy tienes <b>${ch.length} cita${ch.length>1?'s':''}</b> · ${ch[0].hora||''} ${esc(ch[0].cliente||'')}</div></div>`:'';
  $('list').innerHTML=vis.length?grupoDias(vis).map(([f,l])=>`<div class="day"><span>${fLarga(f)}</span><span>${clp(suma(l))}</span></div>`+l.map(c=>itemHTML(c)).join('')).join('')
    :`<p class="empty">Sin cortes ${rangoInicio==='hoy'?'hoy':'esta semana'}.<br>Toca + para agregar uno.</p>`;
}

function renderAgenda(){
  const h=hoy(), l=citas();
  $('agendaList').innerHTML=l.length?grupoDias(l,true).map(([f,arr])=>{
    const d=diff(f,h), cuando=d===0?'Hoy':d===1?'Mañana':fLarga(f);
    return `<div class="day"><span>${cuando}</span><span>${d>1?`en ${d} días`:''}</span></div>`+arr.map(c=>itemHTML(c,d<0?'<span class="tag r">Atrasada</span>':'')).join('');
  }).join(''):'<p class="empty">No tienes citas agendadas.<br>Toca + para agendar una.</p>';
}

function clientesData(){
  const m={};
  hechos().forEach(c=>{if(!c.cliente)return;const k=c.cliente.trim().toLowerCase();
    (m[k]??={nombre:c.cliente.trim(),lista:[]}).lista.push(c)});
  return Object.values(m).map(x=>{x.lista.sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));x.ult=x.lista[0];return x})
    .sort((a,b)=>b.ult.fecha.localeCompare(a.ult.fecha));
}
function renderClientes(){
  const q=$('buscar').value.trim().toLowerCase(), h=hoy();
  const l=clientesData().filter(x=>x.nombre.toLowerCase().includes(q));
  $('cliList').innerHTML=l.length?l.map(x=>{const d=diff(h,x.ult.fecha);return `<div class="item" data-cli="${esc(x.nombre.toLowerCase())}">
    <div style="min-width:0"><div class="n">${esc(x.nombre)}</div><div class="s">${x.lista.length} visita${x.lista.length>1?'s':''} · ${esc(x.ult.servicio||'')}</div></div>
    <div class="since ${d>=30?'r':''}">${haceTxt(d)}</div></div>`}).join('')
    :'<p class="empty">Aún no hay clientes.<br>Aparecen solos al registrar cortes con nombre.</p>';
}
$('buscar').oninput=renderClientes;
function openCliente(k){
  const x=clientesData().find(c=>c.nombre.toLowerCase()===k);if(!x)return;
  const prox=citas().filter(c=>(c.cliente||'').trim().toLowerCase()===k).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];
  const d=diff(hoy(),x.ult.fecha);
  $('cliPanel').innerHTML=`<h2 style="margin-bottom:2px">${esc(x.nombre)}</h2>
    <div class="since ${d>=30?'r':''}" style="text-align:left;margin-bottom:12px">${haceTxt(d)} · último: ${fCorta(x.ult.fecha)}</div>
    <div class="row" style="margin-bottom:10px"><div class="card" style="background:var(--soft)"><small>Visitas</small><b style="display:block;font-size:22px">${x.lista.length}</b></div>
    <div class="card" style="background:var(--soft)"><small>Total gastado</small><b style="display:block;font-size:22px">${clp(suma(x.lista))}</b></div></div>
    ${prox?`<div class="banner" style="background:var(--soft);box-shadow:none">📅<div>Próxima cita: <b>${fLarga(prox.fecha)} ${prox.hora||''}</b></div></div>`:''}
    <label>Últimos servicios</label>
    ${x.lista.slice(0,15).map(c=>`<div class="hist"><div>${esc(c.servicio||'—')}<br><span>${fLarga(c.fecha)}</span></div><b>${clp(c.precio)}</b></div>`).join('')}
    <button class="wide cancel" onclick="closeSheet('cliSheet')">Cerrar</button>`;
  openSheet('cliSheet');
}

function renderResumen(){
  const h=hoy(), ini=addD(h,-(diasRes-1));
  const vis=hechos().filter(c=>c.fecha>=ini&&c.fecha<=h), tot=suma(vis);
  $('resLbl').textContent=`Ganado · ${fCorta(ini)} – ${fCorta(h)}`;
  $('resTot').textContent=clp(tot);$('resCnt').textContent=vis.length;
  $('resProm').textContent=clp(vis.length?tot/vis.length:0);
  const dias=[];for(let i=0;i<diasRes;i++){const f=addD(ini,i),l=vis.filter(c=>c.fecha===f);dias.push({f,v:suma(l),n:l.length})}
  $('resDias').textContent=dias.filter(d=>d.n).length;
  const pp=porPago(vis);
  $('resCaja').innerHTML=PAGOS.map(p=>{const n=vis.filter(c=>c.pago===p).length;return `<div class="cj"><div>${p} <span>· ${n}</span></div><b>${clp(pp[p])}</b></div>`}).join('');
  dibujarGrafico(dias);
}

// ---------- gráfico de barras ----------
function nice(m){if(m<=0)return 10000;const p=10**Math.floor(Math.log10(m)),r=m/p;return (r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*p}
function kfmt(v){return v>=1e6?(v/1e6).toLocaleString('es-CL',{maximumFractionDigits:1})+'M':v>=1000?Math.round(v/1000)+'k':v}
function dibujarGrafico(dias){
  const el=$('chart'),W=el.clientWidth||320,H=170,L=34,B=22,T=16,n=dias.length;
  const max=Math.max(...dias.map(d=>d.v)), top=nice(max*1.1||1), cw=(W-L)/n, gap=n>20?2:Math.max(4,cw*.28), bw=cw-gap, r=Math.min(4,bw/2);
  const y=v=>T+(H-T-B)*(1-v/top);
  const mejor=dias.reduce((a,d)=>d.v>a.v?d:a,dias[0]);
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  [0,top/2,top].forEach(v=>{s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"${v?' stroke-dasharray="2 3"':''}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${v?kfmt(v):0}</text>`});
  dias.forEach((d,i)=>{
    const x=L+i*cw+gap/2, yy=y(d.v), hh=H-B-yy;
    if(d.v>0) s+=`<path class="bar" data-i="${i}" d="M${x},${H-B}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${H-B}Z" fill="var(--bar)"/>`;
    else s+=`<rect x="${x}" y="${H-B-2}" width="${bw}" height="2" rx="1" fill="var(--line)"/>`;
    const dt=parse(d.f), lab=n<=7?dt.toLocaleDateString('es-CL',{weekday:'short'}).slice(0,2)+' '+dt.getDate():dt.getDate();
    const show=n<=7||(n<=15?i%2===(n-1)%2:(n-1-i)%5===0);
    if(show) s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mut)">${lab}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${L+i*cw}" y="0" width="${cw}" height="${H}" fill="transparent"/>`;
  });
  if(mejor.v>0){const i=dias.indexOf(mejor),x=L+i*cw+cw/2;s+=`<text x="${Math.min(Math.max(x,L+14),W-14)}" y="${y(mejor.v)-5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--txt)">${kfmt(mejor.v)}</text>`}
  el.innerHTML=s+'</svg>';
  const tipDef=mejor.v>0?`Mejor día: <b>${fLarga(mejor.f)}</b> · ${clp(mejor.v)}`:'Sin cortes en este período';
  $('tip').innerHTML=tipDef;
  el.querySelectorAll('.hit').forEach(h=>h.onclick=()=>{
    const d=dias[h.dataset.i];
    el.querySelectorAll('.bar').forEach(b=>b.style.opacity=b.dataset.i===h.dataset.i?1:.35);
    $('tip').innerHTML=`<b>${fLarga(d.f)}</b> · ${clp(d.v)} · ${d.n} corte${d.n===1?'':'s'}`;
  });
}
addEventListener('resize',()=>vista==='resumen'&&renderResumen());

// ---------- formulario ----------
function setTipo(t){
  tipo=t;document.querySelectorAll('#fTipo button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('wPag').style.visibility=t==='cita'?'hidden':'visible';$('lPre').textContent=t==='cita'?'Precio aprox.':'Precio';
  $('fTitle').textContent=(editId?'Editar ':'Nuevo ')+(t==='cita'?'cita':'corte');
  $('fHecho').style.display=editId&&t==='cita'?'block':'none';
}
segmento('fTipo',b=>setTipo(b.dataset.t));
function pintarChips(){
  $('serChips').innerHTML=servicios.map(([n,p])=>`<button type="button" data-n="${esc(n)}">${esc(n)}${p?'':' <i>gratis</i>'}</button>`).join('');
}
$('serChips').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  let sel=$('fSer').value.split(' + ').map(s=>s.trim()).filter(s=>servicios.some(([n])=>n===s));
  sel=sel.includes(b.dataset.n)?sel.filter(s=>s!==b.dataset.n):[...sel,b.dataset.n];
  $('fSer').value=sel.join(' + ');
  $('fPre').value=sel.reduce((t,s)=>t+(+servicios.find(([n])=>n===s)[1]||0),0)||'';
  marcarChips();
};
function marcarChips(){const sel=$('fSer').value.split(' + ').map(s=>s.trim());
  document.querySelectorAll('#serChips button').forEach(b=>b.classList.toggle('on',sel.includes(b.dataset.n)))}
$('fSer').oninput=marcarChips;
// Horas cada 30 min (08:00 a 23:30)
const HORAS=[];for(let h=8;h<24;h++)HORAS.push(`${pad(h)}:00`,`${pad(h)}:30`);
function horaRedonda(){const d=new Date();let m=d.getHours()*60+d.getMinutes();m=Math.round(m/30)*30;
  return `${pad(Math.min(Math.floor(m/60),23))}:${m%60?'30':'00'}`}
function setHora(v){
  const ops=[...HORAS];if(v&&!ops.includes(v)){ops.push(v);ops.sort()}   // conserva horas antiguas tipo 17:40
  $('fHor').innerHTML='<option value="">Sin hora</option>'+ops.map(h=>`<option value="${h}">${h}</option>`).join('');
  $('fHor').value=v||'';
}
function openForm(id,t){
  editId=id||null;const c=cortes.find(x=>x.id===id), now=new Date();
  $('fCli').value=c?.cliente||'';$('fSer').value=c?.servicio||'';$('fPre').value=c?.precio||'';
  $('fPag').value=c?.pago||'Efectivo';
  $('fFec').value=c?.fecha||(t==='cita'?addD(hoy(),1):hoy());
  setHora(c?.hora||(t==='cita'?'':horaRedonda()));
  $('fNot').value=c?.nota||'';$('fDel').style.display=c?'block':'none';
  setTipo(c?(c.cita?'cita':'corte'):t||'corte');marcarChips();
  openSheet('formSheet');
}
function marcarHecho(){
  const now=new Date();setTipo('corte');$('fFec').value=hoy();
  if(!$('fHor').value)setHora(horaRedonda());
  $('fHecho').style.display='none';
}
function openSheet(id){$(id).classList.add('open');document.body.classList.add('lock')}
function closeSheet(id){$(id).classList.remove('open');if(!document.querySelector('.sheet.open'))document.body.classList.remove('lock')}
function save(){
  if(!$('fCli').value.trim()&&!$('fSer').value.trim()){$('fSer').focus();$('fSer').style.borderColor='var(--red)';return}
  $('fSer').style.borderColor='';
  const c={id:editId||Date.now().toString(36),cliente:$('fCli').value.trim(),servicio:$('fSer').value.trim(),
    precio:+$('fPre').value||0,pago:$('fPag').value,fecha:$('fFec').value||hoy(),hora:$('fHor').value,nota:$('fNot').value.trim()};
  if(tipo==='cita')c.cita=true;
  if(editId)cortes=cortes.map(x=>x.id===editId?c:x);else cortes.push(c);
  guardar();closeSheet('formSheet');render();
}
function del(){if(confirm('¿Eliminar?')){cortes=cortes.filter(x=>x.id!==editId);guardar();closeSheet('formSheet');render()}}

// ---------- perfil y ajustes ----------
const inicial=n=>(n||'').trim()[0]?.toUpperCase()||'?';
const PERSONA='<svg viewBox="0 0 24 24" width="55%" height="55%" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5z"/></svg>';
function pintarAvatar(el,foto,nom){el.style.backgroundImage=foto?`url(${foto})`:'';el.innerHTML=foto?'':(nom||'').trim()?inicial(nom):PERSONA;
  el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center'}
function pintarPerfil(){
  pintarAvatar($('avBtn'),perfil.foto,perfil.nombre);
  const t=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
  $('fecha').textContent=(perfil.nombre?`Hola, ${perfil.nombre.split(' ')[0]} · `:'')+t[0].toUpperCase()+t.slice(1);
}
function pintarSrv(){
  $('srvList').innerHTML=srvTmp.map(([n,p],i)=>`<div class="srv"><input value="${esc(n)}" placeholder="Servicio" oninput="srvTmp[${i}][0]=this.value">
    <input type="number" inputmode="numeric" value="${p||''}" placeholder="Gratis" oninput="srvTmp[${i}][1]=+this.value||0">
    <button onclick="srvTmp.splice(${i},1);pintarSrv()">×</button></div>`).join('');
}
function addSrv(){srvTmp.push(['',0]);pintarSrv();$('srvList').lastElementChild.querySelector('input').focus()}
function openPerfil(){
  fotoTmp=perfil.foto||null;$('pNom').value=perfil.nombre||'';pintarAvatar($('pFoto'),fotoTmp,perfil.nombre);
  const m=perfil.tema||'auto';document.querySelectorAll('#segTema button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  srvTmp=servicios.map(s=>[...s]);pintarSrv();pintarRespaldo();
  openSheet('perfilSheet');
}
segmento('segTema',b=>{perfil.tema=b.dataset.m;localStorage.setItem(PKEY,JSON.stringify(perfil));aplicarTema()});
function cargarFoto(f){
  if(!f)return;const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas'),S=300;c.width=c.height=S;const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
    fotoTmp=c.toDataURL('image/jpeg',.85);pintarAvatar($('pFoto'),fotoTmp,$('pNom').value);URL.revokeObjectURL(img.src)};
  img.src=URL.createObjectURL(f);
}
function guardarPerfil(){
  perfil={...perfil,nombre:$('pNom').value.trim(),foto:fotoTmp};
  servicios=srvTmp.filter(([n])=>n.trim()).map(([n,p])=>[n.trim(),+p||0]);
  try{localStorage.setItem(PKEY,JSON.stringify(perfil));localStorage.setItem(SKEY,JSON.stringify(servicios))}
  catch{alert('La foto es muy pesada, prueba con otra');return}
  pintarPerfil();pintarChips();closeSheet('perfilSheet');
}

// ---------- respaldo ----------
function pintarRespaldo(){
  const u=perfil.ultResp;$('ultResp').textContent=u?`Último respaldo: ${fCorta(u)}${diff(hoy(),u)>14?' (hace más de 2 semanas)':''}`:'Aún no has hecho un respaldo';
}
async function exportar(){
  const data=JSON.stringify({cortes,servicios,perfil:{nombre:perfil.nombre,tema:perfil.tema}}), name=`silvabarber-${hoy()}.json`;
  const file=new File([data],name,{type:'application/json'});
  const listo=()=>{perfil.ultResp=hoy();localStorage.setItem(PKEY,JSON.stringify(perfil));pintarRespaldo()};
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});listo();return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();listo();
}
function importar(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{let d=JSON.parse(r.result);let lista=Array.isArray(d)?d:d.cortes;if(!Array.isArray(lista))throw 0;
    lista=lista.filter(c=>c&&/^\d{4}-\d\d-\d\d$/.test(c.fecha)).map((c,i)=>({...c,id:String(c.id??Date.now().toString(36)+i),precio:+c.precio||0,pago:PAGOS.includes(c.pago)?c.pago:'Efectivo'}));
    if(confirm(`¿Importar ${lista.length} registros? Reemplaza los actuales.`)){
      cortes=lista;guardar();if(d.servicios){servicios=d.servicios;localStorage.setItem(SKEY,JSON.stringify(servicios));pintarChips()}
      render();closeSheet('perfilSheet')}}
    catch{alert('Archivo no válido')}};
  r.readAsText(f);
}

// ---------- inicio ----------
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
navigator.storage?.persist?.();   // pide al iPhone no borrar los datos
let ultimoDia=hoy();
document.addEventListener('visibilitychange',()=>{   // si la app queda abierta de un día para otro
  if(document.visibilityState==='visible'&&hoy()!==ultimoDia){ultimoDia=hoy();pintarPerfil();render()}
});
aplicarTema();pintarPerfil();pintarChips();render();
</script>
